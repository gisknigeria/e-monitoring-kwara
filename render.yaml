services:
  - type: web
    name: election-monitor-command-center
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /data/data.json
      - key: JWT_SECRET
        generateValue: true
      # Must match the public Render URL so browser requests are not accepted
      # from arbitrary origins. Override this value if the service name changes.
      - key: CORS_ORIGIN
        value: https://election-monitor-command-center.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@command.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_EMAIL
        value: superadmin@command.local
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_4
        sync: false
      - key: GEMINI_API_KEY_5
        sync: false
      - key: GEMINI_API_KEY_6
        sync: false
      - key: GEMINI_API_KEY_7
        sync: false
      - key: GEMINI_API_KEY_8
        sync: false
      - key: GEMINI_API_KEY_9
        sync: false
      - key: GEMINI_API_KEY_10
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-3.5-flash-lite
      - key: METERED_DOMAIN
        sync: false
      - key: METERED_TURN_API_KEY
        sync: false
      - key: METERED_TURN_REGION
        value: standard
    disk:
      name: election-monitor-data
      mountPath: /data
      sizeGB: 1
